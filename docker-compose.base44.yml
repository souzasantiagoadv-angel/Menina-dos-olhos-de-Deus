services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abelhinhas
      POSTGRES_PASSWORD: abelhinhas_dev
      POSTGRES_DB: abelhinhas
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abelhinhas -d abelhinhas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure

  server:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./server:/app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec node --watch src/index.js"]
    environment:
      DATABASE_URL: postgres://abelhinhas:abelhinhas_dev@db:5432/abelhinhas
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

  client:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./client:/app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: on-failure

volumes:
  db_data:
